[project]
name = "qwen-mm-reference"
version = "0.1.0"
description = "Pinned Python reference and baseline benchmark for qwen-mm"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "qwen-vl-utils==0.0.14",
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers==5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_mm_reference"]
