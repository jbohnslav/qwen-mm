[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "qwen-mm"
version = "0.1.0"
description = "Rust multimodal preprocessing for Qwen3-VL and Qwen3.5-VL"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "qwen-mm contributors" }]
keywords = ["qwen", "multimodal", "preprocessing", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub==1.26.0",
    "numpy>=2.3.5,<3",
]

[dependency-groups]
dev = [
    "maturin==1.14.1",
    "pre-commit>=4.6.1",
    "py-spy==0.4.1",
    "ruff>=0.16.1",
]

[tool.uv.workspace]
members = [
    "reference",
]

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
manifest-path = "crates/qwen-mm-python/Cargo.toml"
module-name = "qwen_mm._native"
python-source = "crates/qwen-mm-python/python"
include = [{ path = "vendor/tk-serialize/**/*", format = "sdist" }]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["reference/results"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
