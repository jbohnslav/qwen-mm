[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "qwen-mm"
version = "0.1.0"
description = "Rust multimodal preprocessing for Qwen3-VL and Qwen3.5-VL"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["maturin==1.14.1"]

[tool.uv.workspace]
members = [
    "reference",
]

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
manifest-path = "crates/qwen-mm-python/Cargo.toml"
module-name = "qwen_mm._native"
python-source = "crates/qwen-mm-python/python"
