name: Release candidate (no publishing)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            architecture: x86_64
          - name: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install pinned toolchains and dependencies
        run: |
          uv python install
          rustup show active-toolchain
          uv sync --locked --all-packages
      - name: Build twice, verify, and rehearse publishing
        run: uv run --locked python scripts/release.py --output dist/${{ matrix.name }}
      - name: Verify packaged plugin and dependency compatibility
        if: runner.os == 'Linux'
        run: |
          uv run --locked python scripts/release_vllm.py \
            --core-wheel dist/${{ matrix.name }}/build-1/*.whl \
            --plugin-wheel dist/${{ matrix.name }}/plugin-build-1/*.whl \
            --output dist/${{ matrix.name }}-vllm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidate-${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}/
            dist/${{ matrix.name }}-vllm/*.log
            dist/${{ matrix.name }}-vllm/*.json
            dist/${{ matrix.name }}-vllm/*.txt
          retention-days: 30
          if-no-files-found: error
