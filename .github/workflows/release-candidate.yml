name: Release candidate (no publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            architecture: x86_64
          - name: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install pinned toolchains and dependencies
        run: |
          uv python install
          rustup show active-toolchain
          uv sync --locked --all-packages
      - name: Build twice, verify, and rehearse publishing
        run: uv run --locked python scripts/release.py --output dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-${{ matrix.name }}
          path: dist/${{ matrix.name }}/
          retention-days: 30
