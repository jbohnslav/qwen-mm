name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Install uv-managed Python
        run: uv python install
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run all repository hooks
        run: make pre-commit-check

  rust:
    name: Rust / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Install uv-managed Python
        run: uv python install
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch pinned tokenizer assets for processor tests
        run: |
          uv run --locked python - <<'PYTHON'
          from qwen_mm import Processor
          for profile in Processor.supported_profiles():
              Processor.from_pretrained(profile["model_id"], cache_dir="reference/.cache/huggingface")
          PYTHON
      - name: Run Rust correctness checks
        run: make rust-check

  reference-smoke:
    name: Python reference smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Install uv-managed Python
        run: uv python install
      - name: Verify locked reference fixtures
        run: make reference-smoke

  wheel-smoke:
    name: Python development wheel smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Install uv-managed Python
        run: uv python install
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build and import development wheel
        run: make wheel-smoke

  rosetta:
    name: Production Rosetta / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            architecture: x86_64
          - name: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Install uv-managed Python
        run: uv python install
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Execute published examples from a fresh production wheel
        env:
          ROSETTA_WHEEL_DIR: artifacts/wheels
        run: sh scripts/test-rosetta.sh --output artifacts/${{ matrix.name }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rosetta-${{ matrix.name }}
          path: artifacts/
