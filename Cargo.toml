[workspace]
members = [
    "crates/qwen-mm-core",
    "crates/qwen-mm-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
libjpeg-turbo-rs = { version = "=0.8.0", default-features = false, features = ["simd", "std"] }
numpy = "=0.29.0"
pyo3 = { version = "=0.29.2", features = ["abi3-py311"] }
qwen-mm-core = { path = "crates/qwen-mm-core" }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", features = ["asm"] }
tk-serialize = { version = "=0.1.0-rc.2", default-features = false, features = ["fancy-regex"] }
tokenizers = { version = "=1.0.0-rc.2", default-features = false, features = ["regex"] }
pic-scale = { version = "=0.7.11", default-features = false, features = ["neon", "rdm", "sse", "avx"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# rc.2 fails to initialize the regex fallback for Qwen3.5. See vendor/tk-serialize/PATCH.md.
[patch.crates-io]
tk-serialize = { path = "vendor/tk-serialize" }
