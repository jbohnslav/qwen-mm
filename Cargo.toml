[workspace]
members = [
    "crates/qwen-mm-core",
    "crates/qwen-mm-python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }
libjpeg-turbo-rs = { version = "=0.8.0", default-features = false, features = ["simd", "std"] }
pyo3 = { version = "=0.29.0", features = ["abi3-py311"] }
qwen-mm-core = { path = "crates/qwen-mm-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
