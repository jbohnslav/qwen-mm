[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qwen-mm-vllm-seam"
version = "0.0.1"
description = "Pinned vLLM prepared-pixel seam prototype for qwen-mm"
requires-python = ">=3.11,<3.12"
dependencies = [
    "vllm==0.23.0",
]

[project.entry-points."vllm.general_plugins"]
qwen_mm_prepared_pixels = "qwen_mm_vllm:register"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["qwen_mm_vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
