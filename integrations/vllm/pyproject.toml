[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "qwen-mm-vllm"
version = "0.1.0"
description = "Native still-image processing for pinned prebuilt vLLM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "qwen-mm contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "vllm==0.23.0",
    "qwen-mm==0.1.0",
    "transformers==5.14.1",
]

[project.entry-points."vllm.general_plugins"]
qwen_mm_serving_audit = "qwen_mm_vllm.audit:register_audit"
qwen_mm_native_images = "qwen_mm_vllm.native:register_native"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["qwen_mm_vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
